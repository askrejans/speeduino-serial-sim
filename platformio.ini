; Speeduino serial simulator
;
;   pio run -e esp32s3 -t upload     build and flash (see README for all boards)
;   pio run -e native                desktop simulator: .pio/build/native/program
;   pio test -e native               unit tests on the host

[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
build_src_filter = +<*> -<native/>
test_framework = unity

; ---------------------------------------------------------------- AVR
; Serial only. Compact model: 10 m track table, 50 Hz physics, no noise.

[avr]
platform = atmelavr@5.3.0
build_flags = ${env.build_flags} -D MINIMAL_FEATURES

[env:uno]
extends = avr
board = uno

[env:nano]
extends = avr
board = nanoatmega328

[env:mega]
extends = avr
board = megaatmega2560

; ---------------------------------------------------------------- ESP32
; Full model, Wi-Fi, web dashboard. Speeduino protocol on the USB/UART port.

[esp32_common]
platform = espressif32@8.0.0
build_flags = ${env.build_flags} -D ENABLE_WIFI -D ENABLE_WEB_INTERFACE
lib_deps =
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.12.1
extra_scripts = pre:scripts/embed_web.py

[env:esp32]
extends = esp32_common
board = esp32dev

[env:esp32-wrover]
extends = esp32_common
board = esp-wrover-kit

[env:esp32s2]
extends = esp32_common
board = esp32-s2-saola-1

; ESP32-S3 (XIAO and similar): Speeduino protocol on TCP port 5000 over Wi-Fi,
; USB serial for logs. -D SERIAL_PROTOCOL_ON_USB puts the protocol on USB instead.
[env:esp32s3]
extends = esp32_common
board = seeed_xiao_esp32s3
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0
build_flags = ${esp32_common.build_flags} -D ENABLE_WIFI_SERIAL -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

; Generic ESP32-S3 modules (DevKitC, N8R2 and similar, quad PSRAM or none).
[env:esp32s3-devkit]
extends = esp32_common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
upload_speed = 921600
build_flags = ${esp32_common.build_flags} -D ENABLE_WIFI_SERIAL -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

; Same, with the Speeduino protocol on the USB port (like a real board) and
; no log output.
[env:esp32s3-devkit-usb]
extends = env:esp32s3-devkit
build_flags = ${env:esp32s3-devkit.build_flags} -D SERIAL_PROTOCOL_ON_USB

; ---------------------------------------------------------------- ESP8266

[esp8266_common]
platform = espressif8266@4.2.1
build_flags = ${env.build_flags} -D ENABLE_WIFI -D ENABLE_WEB_INTERFACE
lib_deps =
    esp32async/ESPAsyncTCP@^2.0.0
    esp32async/ESPAsyncWebServer@^3.12.1
extra_scripts = pre:scripts/embed_web.py

[env:esp8266]
extends = esp8266_common
board = nodemcuv2

[env:d1_mini]
extends = esp8266_common
board = d1_mini

; ---------------------------------------------------------------- Desktop
; Same model and protocol on a TCP port or a pseudo-terminal; also runs the
; unit tests (pio test -e native).

[env:native]
platform = native@1.2.1
framework =
build_flags = -std=gnu++17 -Wall -Wextra -D NATIVE_SIM -lm
build_src_filter = +<*> -<main.cpp> -<WebInterface.cpp>
test_build_src = yes
